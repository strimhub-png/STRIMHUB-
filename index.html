<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>STRIMHUB</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080d;--bg2:#0e0f18;--bg3:#171a28;--card:#131525;--card2:#1b1e33;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--txt:#f5f6ff;--muted:#9aa0bf;--muted2:#6b7193;--accent:#7c5cff;--accent2:#ff4ecd;--radius:20px;--shadow:0 10px 40px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.06) inset;--max:720px;--header-h:64px;}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif}
.sh-app{max-width:var(--max);margin:0 auto;min-height:100vh;padding:0 14px 120px}
.sh-header{position:sticky;top:0;z-index:40;backdrop-filter:blur(20px) saturate(160%);background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid var(--line);height:var(--header-h);display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 -14px;padding:0 14px}
.sh-brand{font-family:Space Grotesk,sans-serif;font-weight:800;font-size:26px;letter-spacing:-.04em;background:linear-gradient(100deg,var(--txt) 0%, #a79cff 55%, var(--accent2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;border:0;background-color:transparent;padding:0;cursor:pointer}
.sh-actions{display:flex;align-items:center;gap:8px}
.sh-icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--txt);cursor:pointer}
.sh-search-wrap{position:relative;flex:1;max-width:380px;display:none}
.sh-search-wrap.open{display:block;position:absolute;left:14px;right:14px;top:70px;z-index:5}
@media(min-width:640px){.sh-search-wrap{display:block;position:relative;top:auto;left:auto;right:auto}.sh-search-wrap.open{position:relative}}
.sh-search{width:100%;height:42px;border-radius:999px;border:1px solid var(--line);background:var(--card);padding:0 42px;color:var(--txt);outline:0}
.sh-search-ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.6;pointer-events:none}
.sh-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:0;background:var(--bg3);display:grid;place-items:center;color:var(--txt);cursor:pointer}
.sh-cats{display:flex;gap:10px;overflow:auto;padding:14px 2px 10px;scrollbar-width:none;position:sticky;top:var(--header-h);z-index:30;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(16px);margin:0 -14px;padding-left:14px;padding-right:14px}
.sh-cats::-webkit-scrollbar{display:none}
.sh-pill{white-space:nowrap;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:600;font-size:13.5px;flex-shrink:0;cursor:pointer}
.sh-pill.active{background:linear-gradient(100deg,var(--accent),var(--accent2));color:white;border-color:transparent}
.sh-grid{padding-top:10px;display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:560px){.sh-grid{grid-template-columns:1fr 1fr;gap:16px}}
.sh-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:.28s;position:relative;width:100%;text-align:left;cursor:pointer}
.sh-card:hover{transform:translateY(-3px);border-color:var(--line2)}
.sh-thumb-wrap{position:relative;background:var(--bg3);overflow:hidden;aspect-ratio:16/9}
.sh-thumb{width:100%;height:100%;object-fit:cover}
.sh-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.92);color:#0a0a0f}
.sh-badge{position:absolute;left:10px;top:10px;z-index:2;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase;background:rgba(10,10,15,.72);color:#fff;border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px)}
.sh-badge.reels{background:linear-gradient(100deg,#7c5cff,#ff4ecd)}.sh-badge.movies{background:linear-gradient(100deg,#00c6ff,#0072ff)}.sh-badge.trending{background:linear-gradient(100deg,#ff8a00,#ff4ecd)}.sh-badge.clips{background:linear-gradient(100deg,#3cf0de,#7c5cff)}
.sh-card-body{padding:13px 14px 14px}
.sh-title{font-family:Space Grotesk,sans-serif;font-weight:700;font-size:16px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:40px}
.sh-desc{margin-top:6px;color:var(--muted);font-size:13px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.sh-meta{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--muted2);font-size:12px}
.sh-pag{display:flex;align-items:center;justify-content:center;gap:8px;padding:22px 0 8px;flex-wrap:wrap}
.sh-pag button{min-width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;color:var(--txt);cursor:pointer}
.sh-pag button.active{background:var(--txt);color:var(--bg)}
.sh-watch{display:none}.sh-watch.open{display:block}
.sh-back{margin-top:12px;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;color:var(--txt);cursor:pointer}
.sh-player-shell{margin-top:14px;border-radius:22px;overflow:hidden;background:#000;border:1px solid var(--line);position:relative}
.sh-player-shell.portrait{max-width:360px;margin-left:auto;margin-right:auto}
.sh-player-ratio{position:relative;width:100%;padding-bottom:56.25%;background:#000}
.sh-player-ratio.r-916{padding-bottom:177.77%}.sh-player-ratio.r-11{padding-bottom:100%}.sh-player-ratio.r-43{padding-bottom:75%}
.sh-player-ratio iframe{position:absolute;left:0;top:0;width:100%;height:calc(100% + 56px);border:0;transform:translateY(-56px);background:#000}
.sh-player-loader{position:absolute;inset:0;display:grid;place-items:center;background:#0a0a0f;color:#fff;z-index:2}
.sh-watch-meta{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.sh-watch-meta h1{font-family:Space Grotesk,sans-serif;font-size:22px;margin:0}
.sh-watch-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.sh-btn{height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap;color:var(--txt);cursor:pointer}
.sh-btn.primary{background:linear-gradient(100deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.sh-related-head{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 12px}
.sh-toast-stack{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:90;display:grid;gap:10px;width:min(92%,420px)}
.sh-toast{padding:12px 14px;border-radius:999px;background:var(--txt);color:var(--bg);font-weight:600;font-size:13.5px}

.sh-overlay{position:fixed;inset:0;z-index:200;background:rgba(5,6,12,.75);backdrop-filter:blur(18px);display:none;align-items:center;justify-content:center;padding:16px}
.sh-overlay.open{display:flex}
.sh-modal{width:min(560px,100%);background:var(--card);border:1px solid var(--line2);border-radius:24px;box-shadow:0 24px 80px rgba(0,0,0,.6);overflow:hidden}
.sh-modal-head{padding:18px 18px 0;display:flex;align-items:center;justify-content:space-between}
.sh-modal-head h3{margin:0;font-family:Space Grotesk,sans-serif;font-size:20px}
.sh-modal-body{padding:18px}
.sh-field{display:grid;gap:6px;margin-bottom:14px}
.sh-field label{font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.sh-input,.sh-textarea,.sh-select{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--txt);padding:12px 13px;outline:0}
.sh-textarea{min-height:88px;resize:vertical}
.sh-row{display:flex;gap:10px;flex-wrap:wrap}
.sh-admin{width:min(760px,100%);max-height:90vh;overflow:auto}
.sh-tabs{display:flex;gap:8px;padding:12px 18px 0}
.sh-tab{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg3);font-weight:600;font-size:13px;cursor:pointer}
.sh-tab.active{background:var(--txt);color:var(--bg);border-color:var(--txt)}
.sh-admin-list{display:grid;gap:10px;margin-top:12px}
.sh-admin-item{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--bg2)}
.sh-admin-item img{width:72px;height:54px;object-fit:cover;border-radius:10px;background:var(--bg3)}
.sh-mini{font-size:12px;color:var(--muted)}
.sh-code{width:100%;min-height:160px;font-family:ui-monospace,monospace;font-size:12.5px;white-space:pre;overflow:auto}
.sh-preview{margin-top:12px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg2)}
.sh-empty{border:1px dashed var(--line2);border-radius:var(--radius);padding:50px 20px;text-align:center;background:var(--card);margin-top:20px}
</style>
</head>
<body>
<div class="sh-app">
  <header class="sh-header">
    <button class="sh-brand" id="brandBtn">STRIMHUB</button>
    <div class="sh-actions">
      <div class="sh-search-wrap" id="searchWrap">
        <span class="sh-search-ic">⌕</span>
        <input id="searchInput" class="sh-search" placeholder="Search videos..." autocomplete="off">
        <button class="sh-clear" id="clearSearch">✕</button>
      </div>
      <button class="sh-icon-btn" id="searchToggle">⌕</button>
    </div>
  </header>
    <nav class="sh-cats" id="catBar"></nav>
  <main id="homeView">
    <div class="sh-grid" id="grid"></div>
    <div id="emptyState" class="sh-empty" style="display:none">
      <h3 style="font-family:Space Grotesk;margin:0 0 8px">No videos yet</h3>
      <div style="color:var(--muted);font-size:14px">Click the logo 5 times to open the Admin Login and add your videos.</div>
    </div>
    <div class="sh-pag" id="pagination"></div>
  </main>

  <section class="sh-watch" id="watchView">
    <button class="sh-back" id="backBtn">← Back to browse</button>
    <div class="sh-player-shell" id="playerShell">
      <div class="sh-player-ratio" id="playerRatio">
        <div class="sh-player-loader" id="playerLoader">Loading player…</div>
        <iframe id="playerFrame" allow="autoplay; fullscreen; encrypted-media" allowfullscreen referrerpolicy="no-referrer"></iframe>
      </div>
    </div>
    <div class="sh-watch-meta">
      <div id="watchBadge" class="sh-badge" style="position:static;display:inline-flex;margin-bottom:10px">—</div>
      <h1 id="watchTitle">—</h1>
      <p id="watchDesc" style="color:var(--muted);line-height:1.6;margin:10px 0 0"></p>
      <div class="sh-watch-actions">
        <button class="sh-btn" id="copyBtn">🔗 Copy Link</button>
        <button class="sh-btn" id="shareBtn">↗ Share</button>
        <button class="sh-btn primary" id="downloadBtn">⬇ Download</button>
      </div>
    </div>

    <div class="sh-related-head"><h2 style="font-family:Space Grotesk;margin:0">Related Videos</h2></div>
    <div class="sh-grid" id="relatedGrid"></div>
    <div style="display:flex;justify-content:center;margin-top:18px;padding-bottom:10px">
      <button class="sh-btn" id="moreRelatedBtn" style="min-width:160px;justify-content:center">More ↓</button>
    </div>
  </section>
</div>

<div class="sh-overlay" id="loginOverlay">
  <div class="sh-modal">
    <div class="sh-modal-head"><h3>Admin Login</h3><button class="sh-icon-btn" data-close="loginOverlay">✕</button></div>
    <div class="sh-modal-body">
      <div style="color:var(--muted);font-size:13px;margin-bottom:12px">Access unlocked with 5 taps on the logo</div>
      <div class="sh-field"><label>Username</label><input id="loginUser" class="sh-input" value="chiku_.3919"></div>
      <div class="sh-field"><label>Password</label><input id="loginPass" class="sh-input" type="password" value="Chintan@2009"></div>
      <div id="loginErr" style="display:none;color:#ff5a6a;font-size:13px;font-weight:600;margin-bottom:10px">Invalid credentials</div>
      <div class="sh-row"><button class="sh-btn primary" id="doLogin">Login</button><button class="sh-btn" data-close="loginOverlay">Cancel</button></div>
    </div>
  </div>
</div>

<div class="sh-overlay" id="adminOverlay">
  <div class="sh-modal sh-admin">
    <div class="sh-modal-head"><h3>STRIMHUB Admin — Video Management</h3><div class="sh-row"><button class="sh-btn" id="logoutBtn">Logout</button><button class="sh-icon-btn" data-close="adminOverlay">✕</button></div></div>
    <div class="sh-tabs"><button class="sh-tab active" data-tab="add">ADD VIDEO</button><button class="sh-tab" data-tab="manage">MANAGE VIDEOS</button></div>
    <div class="sh-modal-body">
      <div id="tabAdd">
        <div class="sh-field"><label>Google Drive URL / File ID</label><input id="fDrive" class="sh-input" placeholder="https://drive.google.com/file/d/FILE_ID/view"></div>
        <div id="extractInfo" style="display:none;background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px"></div>
        <div class="sh-field"><label>Download URL (optional)</label><input id="fDownload" class="sh-input" placeholder="https://..."></div>
        <div class="sh-field"><label>Video Title</label><input id="fTitle" class="sh-input" placeholder="My new video"></div>
        <div class="sh-field"><label>Description</label><textarea id="fDesc" class="sh-textarea" placeholder="Description..."></textarea></div>
        <div class="sh-row" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div class="sh-field"><label>Category</label><select id="fCat" class="sh-select"><option value="">Select</option><option>Reels</option><option>Movies</option><option>Trending</option><option>Clips</option></select></div>
          <div class="sh-field"><label>Aspect Ratio</label><select id="fRatio" class="sh-select"><option value="">Select</option><option>9:16</option><option>16:9</option><option>1:1</option><option>4:3</option></select></div>
        </div>
        <div class="sh-preview" id="livePreview" style="display:none"></div>
        <div class="sh-row" style="margin-top:14px"><button class="sh-btn primary" id="addVideoBtn">Add Video</button><button class="sh-btn" id="genSnippetBtn">Generate Snippet</button></div>
        <div class="sh-field" style="margin-top:14px"><label>Backup</label><textarea id="snippetArea" class="sh-code sh-textarea"></textarea><div class="sh-row" style="margin-top:8px"><button class="sh-btn" id="copySnippetBtn">Copy Snippet</button><button class="sh-btn" id="copyAllBtn">Copy All</button><button class="sh-btn" id="clearAllBtn" style="background:#ff5a6a;color:#fff">Clear All Local Data</button></div></div>
      </div>
      <div id="tabManage" style="display:none"><div id="manageList" class="sh-admin-list"></div></div>
    </div>
  </div>
</div>

<div class="sh-overlay" id="confirmOverlay">
  <div class="sh-modal" style="width:min(420px,100%)">
    <div class="sh-modal-head"><h3>Delete video?</h3><button class="sh-icon-btn" data-close="confirmOverlay">✕</button></div>
    <div class="sh-modal-body"><div id="confirmText" style="color:var(--muted)">This will remove the video.</div><div class="sh-row" style="margin-top:14px"><button class="sh-btn primary" id="confirmDelBtn" style="background:#ff5a6a">Delete</button><button class="sh-btn" data-close="confirmOverlay">Cancel</button></div></div>
  </div>
</div>

<div class="sh-toast-stack" id="toastStack"></div>
<script>
let activeDB = [];
let state = {q:"", cat:"All", page:1, perPage:8, playing:null, relatedCount:6, pendingDelete:null};
const CATS=["All","Reels","Movies","Trending","Clips"];
const LS_DB='sh_local_db';
const ADMIN_USER='chiku_.3919', ADMIN_PASS='Chintan@2009';

function thumbUrl(id){ return `https://drive.google.com/thumbnail?id=${id}&sz=w1000`; }
function previewUrl(id){ return `https://drive.google.com/file/d/${id}/preview`; }
function deepLink(id){ return `${location.origin}${location.pathname}?play=${encodeURIComponent(id)}`; }
function toast(msg){ const stack=document.getElementById('toastStack'); const el=document.createElement('div'); el.className='sh-toast'; el.textContent=msg; stack.appendChild(el); setTimeout(()=>el.remove(),2500); }
function saveLocal(){ localStorage.setItem(LS_DB, JSON.stringify(activeDB)); }
function loadLocal(){ try{ const raw=localStorage.getItem(LS_DB); if(raw){ const p=JSON.parse(raw); if(Array.isArray(p)) return p; } }catch{} return []; }
function extractDriveId(input){
  if(!input) return ""; input=input.trim();
  const raw=input.match(/^[a-zA-Z0-9_-]{25,}$/); if(raw) return input;
  let m; m=input.match(/\/d\/([a-zA-Z0-9_-]+)/); if(m) return m[1];
  m=input.match(/[?&]id=([a-zA-Z0-9_-]+)/); if(m) return m[1]; return "";
}
function openOverlay(id){ document.getElementById(id)?.classList.add('open'); }
function closeOverlay(id){ document.getElementById(id)?.classList.remove('open'); }
document.querySelectorAll('[data-close]').forEach(b=>{ b.addEventListener('click',()=> closeOverlay(b.dataset.close)); });
document.querySelectorAll('.sh-overlay').forEach(o=>{ o.addEventListener('click',(e)=>{ if(e.target===o) closeOverlay(o.id); }); });

(function secretTrigger(){
  let clicks=0,timer=null;
  const brand=document.getElementById('brandBtn');
  brand.addEventListener('click',(e)=>{
    e.stopPropagation();
    clicks++; clearTimeout(timer); timer=setTimeout(()=>{ clicks=0; },1500);
    if(clicks>=5){ clicks=0; openOverlay('loginOverlay'); toast('Admin login unlocked'); return; }
    if(document.getElementById('watchView').classList.contains('open')){ location.href = location.pathname; } else { window.scrollTo({top:0,behavior:'smooth'}); }
  });
})();

document.getElementById('doLogin').addEventListener('click',()=>{
  const u=document.getElementById('loginUser').value.trim(), p=document.getElementById('loginPass').value;
  if(u===ADMIN_USER && p===ADMIN_PASS){ closeOverlay('loginOverlay'); openOverlay('adminOverlay'); document.getElementById('loginErr').style.display='none'; toast('Login successful'); renderManage(); }
  else { document.getElementById('loginErr').style.display='block'; toast('Invalid credentials'); }
});
document.getElementById('logoutBtn').addEventListener('click',()=>{ closeOverlay('adminOverlay'); toast('Logged out'); });

document.querySelectorAll('.sh-tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.sh-tab').forEach(x=>x.classList.remove('active')); t.classList.add('active');
    document.getElementById('tabAdd').style.display= t.dataset.tab==='add'? 'block':'none';
    document.getElementById('tabManage').style.display= t.dataset.tab==='manage'? 'block':'none';
    if(t.dataset.tab==='manage') renderManage();
  });
});

function createCard(v){
  const card=document.createElement('div'); card.className='sh-card';
  const badgeClass=(v.category||'').toLowerCase();
  card.innerHTML=`<div class="sh-thumb-wrap"><span class="sh-badge ${badgeClass}">${v.category}</span><img class="sh-thumb" src="${thumbUrl(v.id)}" loading="lazy" onerror="this.style.display='none'"><span class="sh-play">▶</span></div><div class="sh-card-body"><div class="sh-title">${v.title}</div><div class="sh-desc">${v.description}</div><div class="sh-meta"><span>${v.ratio}</span> • <span>${v.category}</span></div></div>`;
  card.onclick=()=> {
    openWatch(v.id);
  }; 
  return card;
}

function filtered(){
  const q=state.q.toLowerCase();
  return activeDB.filter(v=>{ const catOk=state.cat==="All"||v.category===state.cat; const sOk=!q||v.title.toLowerCase().includes(q)||v.description.toLowerCase().includes(q); return catOk&&sOk; });
}
function renderCats(){ const bar=document.getElementById('catBar'); bar.innerHTML=''; CATS.forEach(c=>{ const b=document.createElement('button'); b.className='sh-pill'+(state.cat===c?' active':''); b.textContent=c; b.onclick=()=>{ state.cat=c; state.page=1; renderCats(); renderGrid(); }; bar.appendChild(b); }); }
function renderGrid(){
  const list=filtered(); const grid=document.getElementById('grid'); grid.innerHTML='';
  const empty=document.getElementById('emptyState');
  if(list.length===0){ empty.style.display='block'; document.getElementById('pagination').innerHTML=''; return; }
  empty.style.display='none';
  const totalPages=Math.max(1,Math.ceil(list.length/state.perPage)); if(state.page>totalPages) state.page=totalPages;
  const start=(state.page-1)*state.perPage; const slice=list.slice(start,start+state.perPage);
  slice.forEach((v)=>{
    grid.appendChild(createCard(v));
  });
  const pag=document.getElementById('pagination'); pag.innerHTML='';
  for(let i=1;i<=totalPages;i++){ const b=document.createElement('button'); b.textContent=i; if(i===state.page) b.className='active'; b.onclick=()=>{ state.page=i; renderGrid(); window.scrollTo({top:0,behavior:'smooth'}); }; pag.appendChild(b); }
}
function setPlayerRatio(ratio){ const r=document.getElementById('playerRatio'); const shell=document.getElementById('playerShell'); r.className='sh-player-ratio'; shell.classList.remove('portrait'); if(ratio==='9:16'){ r.classList.add('r-916'); shell.classList.add('portrait'); } else if(ratio==='1:1'){ r.classList.add('r-11'); } else if(ratio==='4:3'){ r.classList.add('r-43'); } }

function openWatch(id){
  const v=activeDB.find(x=>x.id===id); if(!v) return; 
  state.playing=v; setPlayerRatio(v.ratio);
  document.getElementById('homeView').style.display='none'; 
  document.getElementById('watchView').classList.add('open');
  document.getElementById('watchTitle').textContent=v.title; 
  document.getElementById('watchDesc').textContent=v.description;
  const badge=document.getElementById('watchBadge'); 
  badge.textContent=v.category; 
  badge.className='sh-badge '+v.category.toLowerCase();
  
  const loader=document.getElementById('playerLoader'); 
  loader.style.display='grid'; 
  const iframe=document.getElementById('playerFrame'); 
  iframe.src= previewUrl(v.id); 
  iframe.onload=()=>{ loader.style.display='none'; };
  renderRelated();
}

function renderRelated(){

    grid.appendChild(createCard(v));
  });
}

document.getElementById('addVideoBtn').addEventListener('click',()=>{

function renderManage(){

document.getElementById('confirmDelBtn').addEventListener('click',()=>{ const id=state.pendingDelete; if(!id) return; activeDB=activeDB.filter(v=>v.id!==id); saveLocal(); closeOverlay('confirmOverlay'); renderGrid(); renderCats(); renderManage(); toast('Deleted'); });

const BLOGGER_FEED_URL = 'https://streamhub69.blogspot.com/feeds/posts/default?alt=json&max-results=150';
const CORS_PROXY = 'https://api.allorigins.win/raw?url=';

function fetchBloggerJSONP(){
  return new Promise((resolve, reject)=>{
    const cbName='blogger_cb_'+Date.now(); const scriptId=cbName+'_script';
    const timeoutId=setTimeout(()=>{ const s=document.getElementById(scriptId); if(s) s.remove(); if(window[cbName]) delete window[cbName]; reject(new Error('JSONP timeout')); }, 10000);
    window[cbName]=(json)=>{ clearTimeout(timeoutId); const s=document.getElementById(scriptId); if(s) s.remove(); delete window[cbName]; resolve(json); };
    const script=document.createElement('script'); script.id=scriptId; script.src=BLOGGER_FEED_URL.replace('alt=json','alt=json-in-script')+'&callback='+cbName+'&t='+Date.now(); script.onerror=()=>{ clearTimeout(timeoutId); const s=document.getElementById(scriptId); if(s) s.remove(); delete window[cbName]; reject(new Error('JSONP script error')); }; document.body.appendChild(script);
  });
}

async function fetchBloggerDB(){
  try{
    let data=null;
    try{ data=await fetchBloggerJSONP(); }catch(e){}
    if(!data){
      try{
        const controller=new AbortController(); const timeout=setTimeout(()=>controller.abort(), 8000);
        const res=await fetch(BLOGGER_FEED_URL+'&t='+Date.now(), {signal: controller.signal});
        clearTimeout(timeout);
        if(res.ok) data=await res.json();
      }catch(e){}
    }
    if(!data){
      try{
        const proxyUrl=CORS_PROXY+encodeURIComponent(BLOGGER_FEED_URL+'&t='+Date.now());
        const res2=await fetch(proxyUrl);
        if(res2.ok){ const text=await res2.text(); data=JSON.parse(text); }
      }catch(e){}
    }
    if(!data) throw new Error('All methods failed');
    const entries=data.feed?.entry||[];
    let foundVideos=[];
    for(const entry of entries){
      const title=entry.title?.$t||''; const content=entry.content?.$t||'';
      const linkHref=(entry.link||[]).find(l=>l.rel==='alternate')?.href||'';
      if(title.toLowerCase().includes('database') || title.toLowerCase().includes('blog-post') || linkHref.includes('blog-post') || content.includes('"id"') || content.includes('[')){
        try{
          let clean=content.replace(/<[^>]*>/g,' ').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>');
          const match=clean.match(/\[\s*\{[\s\S]*?\}\s*\]/);
          if(match){ let parsed=JSON.parse(match[0]); if(Array.isArray(parsed)&&parsed.length>0){foundVideos=parsed; break;} }
          const trimmed=clean.trim(); if(trimmed.startsWith('[')){ let parsed2=JSON.parse(trimmed); if(Array.isArray(parsed2)&&parsed2.length>0){foundVideos=parsed2; break;} }
        }catch(e){}
      }
    }
    if(foundVideos.length>0){
      foundVideos=foundVideos.map(v=>({id:(v.id||'').trim(), title:v.title||'Untitled', description:v.description||'', category:v.category||'Reels', ratio:v.ratio||'16:9', downloadUrl:v.downloadUrl||v.downloadUrl1||v.download||''})).filter(v=>v.id);
      activeDB=foundVideos; saveLocal(); renderCats(); renderGrid(); renderManage();
      const p=new URLSearchParams(location.search).get('play');
      if(p) setTimeout(()=>openWatch(p),300);
      return;
    }
  }catch(err){ console.error(err); }
  activeDB=loadLocal(); if(activeDB.length===0) activeDB=[]; renderCats(); renderGrid(); renderManage();
  const p=new URLSearchParams(location.search).get('play');
  if(p) setTimeout(()=>openWatch(p),300);
}

(function initDB(){
  activeDB = loadLocal();
  renderCats(); renderGrid(); renderManage();
  fetchBloggerDB();
})();
