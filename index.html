<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>STRIMHUB — All Real Ads Integrated</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080d;--bg2:#0e0f18;--bg3:#171a28;--card:#131525;--card2:#1b1e33;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --txt:#f5f6ff;--muted:#9aa0bf;--muted2:#6b7193;
  --accent:#7c5cff;--accent2:#ff4ecd;--radius:20px;--shadow:0 10px 40px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.06) inset;
  --max:720px;--header-h:64px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif}
.sh-app{max-width:var(--max);margin:0 auto;min-height:100vh;padding:0 14px 120px}
.sh-header{position:sticky;top:0;z-index:40;backdrop-filter:blur(20px) saturate(160%);background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid var(--line);height:var(--header-h);display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 -14px;padding:0 14px}
.sh-brand{font-family:Space Grotesk,sans-serif;font-weight:800;font-size:26px;letter-spacing:-.04em;background:linear-gradient(100deg,var(--txt) 0%, #a79cff 55%, var(--accent2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;border:0;background-color:transparent;padding:0}
.sh-actions{display:flex;align-items:center;gap:8px}
.sh-icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--txt)}
.sh-search-wrap{position:relative;flex:1;max-width:380px;display:none}
.sh-search-wrap.open{display:block;position:absolute;left:14px;right:14px;top:70px;z-index:5}
@media(min-width:640px){.sh-search-wrap{display:block;position:relative;top:auto;left:auto;right:auto}.sh-search-wrap.open{position:relative}}
.sh-search{width:100%;height:42px;border-radius:999px;border:1px solid var(--line);background:var(--card);padding:0 42px;color:var(--txt);outline:0}
.sh-search-ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.6;pointer-events:none}
.sh-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:0;background:var(--bg3);display:grid;place-items:center;color:var(--txt)}
.sh-cats{display:flex;gap:10px;overflow:auto;padding:14px 2px 10px;scrollbar-width:none;position:sticky;top:var(--header-h);z-index:30;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(16px);margin:0 -14px;padding-left:14px;padding-right:14px}
.sh-cats::-webkit-scrollbar{display:none}
.sh-pill{white-space:nowrap;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:600;font-size:13.5px;flex-shrink:0}
.sh-pill.active{background:linear-gradient(100deg,var(--accent),var(--accent2));color:white;border-color:transparent}
.sh-grid{padding-top:10px;display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:560px){.sh-grid{grid-template-columns:1fr 1fr;gap:16px}}
.sh-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:.28s;position:relative;width:100%;text-align:left}
.sh-card:hover{transform:translateY(-3px);border-color:var(--line2)}
.sh-thumb-wrap{position:relative;background:var(--bg3);overflow:hidden;aspect-ratio:16/9}
.sh-thumb{width:100%;height:100%;object-fit:cover}
.sh-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.92);color:#0a0a0f}
.sh-badge{position:absolute;left:10px;top:10px;z-index:2;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase;background:rgba(10,10,15,.72);color:#fff;border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px)}
.sh-badge.reels{background:linear-gradient(100deg,#7c5cff,#ff4ecd)}.sh-badge.movies{background:linear-gradient(100deg,#00c6ff,#0072ff)}.sh-badge.trending{background:linear-gradient(100deg,#ff8a00,#ff4ecd)}.sh-badge.clips{background:linear-gradient(100deg,#3cf0de,#7c5cff)}
.sh-card-body{padding:13px 14px 14px}
.sh-title{font-family:Space Grotesk,sans-serif;font-weight:700;font-size:16px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:40px}
.sh-desc{margin-top:6px;color:var(--muted);font-size:13px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.sh-meta{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--muted2);font-size:12px}
.sh-pag{display:flex;align-items:center;justify-content:center;gap:8px;padding:22px 0 8px;flex-wrap:wrap}
.sh-pag button{min-width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;color:var(--txt)}
.sh-pag button.active{background:var(--txt);color:var(--bg)}
.sh-watch{display:none}.sh-watch.open{display:block}
.sh-back{margin-top:12px;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;color:var(--txt)}
.sh-player-shell{margin-top:14px;border-radius:22px;overflow:hidden;background:#000;border:1px solid var(--line);position:relative}
.sh-player-shell.portrait{max-width:360px;margin-left:auto;margin-right:auto}
.sh-player-ratio{position:relative;width:100%;padding-bottom:56.25%;background:#000}
.sh-player-ratio.r-916{padding-bottom:177.77%}.sh-player-ratio.r-11{padding-bottom:100%}.sh-player-ratio.r-43{padding-bottom:75%}
.sh-player-ratio iframe{position:absolute;left:0;top:0;width:100%;height:calc(100% + 56px);border:0;transform:translateY(-56px);background:#000}
.sh-shield{position:absolute;top:0;right:0;width:86px;height:62px;z-index:3}
.sh-player-loader{position:absolute;inset:0;display:grid;place-items:center;background:#0a0a0f;color:#fff;z-index:2}
.sh-watch-meta{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.sh-watch-meta h1{font-family:Space Grotesk,sans-serif;font-size:22px;margin:0}
.sh-watch-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.sh-btn{height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap;color:var(--txt)}
.sh-btn.primary{background:linear-gradient(100deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.sh-related-head{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 12px}
/* Player Overlay */
.sh-player-overlay{position:absolute;left:0;right:0;bottom:0;z-index:6;display:none;flex-direction:column;background:rgba(12,13,24,.94);border-top:1px solid var(--line2);backdrop-filter:blur(12px);padding:8px}
.sh-player-overlay.open{display:flex}
.sh-player-overlay-head{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.sh-player-overlay-timer{padding:4px 10px;border-radius:999px;background:var(--bg3);border:1px solid var(--line);font-weight:700;color:var(--txt);font-size:11px}
.sh-player-overlay-close{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--card2);display:none;place-items:center;color:var(--txt);font-weight:800;font-size:11px}
.sh-player-overlay-close.show{display:grid}
.sh-player-overlay-slot{width:100%;min-height:90px;max-height:110px;border-radius:10px;background:#0a0a0f;display:grid;place-items:center;overflow:hidden}
/* In-Article 2:1 */
.sh-inarticle-wrap{margin:20px 0 0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;overflow:hidden}
.sh-inarticle-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2);margin-bottom:8px;display:flex;justify-content:space-between}
.sh-inarticle-ad{width:100%;aspect-ratio:2/1;max-height:340px;min-height:200px;border-radius:14px;background:#0e0f1a;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
.sh-toast-stack{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:90;display:grid;gap:10px;width:min(92%,420px)}
.sh-toast{padding:12px 14px;border-radius:999px;background:var(--txt);color:var(--bg);font-weight:600;font-size:13.5px}
/* Interstitial */
.sh-inter-overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(4,5,12,.82);backdrop-filter:blur(16px)}
.sh-inter-overlay.open{display:flex}
.sh-inter-card{width:min(92vw,420px);background:var(--card2);border:1px solid var(--line2);border-radius:24px;box-shadow:0 20px 80px rgba(0,0,0,.6);overflow:hidden;position:relative}
.sh-inter-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.sh-inter-timer{padding:6px 12px;border-radius:999px;background:var(--bg3);border:1px solid var(--line);font-weight:700;color:var(--txt);font-size:12px}
.sh-inter-close{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:none;place-items:center;font-weight:800;color:var(--txt)}
.sh-inter-close.show{display:grid}
.sh-inter-body{padding:16px;display:grid;gap:12px}
.sh-inter-ad-slot{min-height:280px;border-radius:16px;background:#0a0a0f;display:grid;place-items:center;overflow:hidden;padding:8px}
.sh-inter-foot{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted2)}
/* Ads general */
.ad-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2);margin-bottom:6px;text-align:center}
.sh-top-strip{margin:12px -14px 0;padding:10px 14px 14px;background:var(--bg2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:block}
.sh-top-ad-slot{width:100%;min-height:90px;max-width:728px;margin:0 auto;border-radius:14px;background:#0a0a0f;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
.sh-grid-ad{grid-column:1/-1;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);min-height:250px;display:grid;place-items:center;overflow:hidden}
@media(min-width:560px){.sh-grid-ad{grid-column:auto}}
.sh-sticky-bottom{position:fixed;left:0;right:0;bottom:0;z-index:85;display:flex;flex-direction:column;align-items:center;padding:6px 10px 10px;background:rgba(10,11,20,.96);border-top:1px solid var(--line);backdrop-filter:blur(14px);gap:4px}
.sh-sticky-ad-slot{width:min(100%,320px);min-height:50px;border-radius:10px;background:#0a0a0f;display:grid;place-items:center;overflow:hidden}
.sh-sticky-close{position:absolute;right:8px;top:6px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--card2);display:grid;place-items:center;color:var(--txt);font-weight:800;font-size:12px}
</style>
</head>

<script>
const videoDatabase = [
  {id:"1d2M3n4Op5Q6r7S8t9U0v1W2x3Y4z5A6", title:"Neon City Drive — 4K Cinematic Reel", description:"Midnight drive through neon Tokyo with anamorphic bokeh and synthwave vibes.", category:"Reels", ratio:"9:16", downloadUrl:""},
  {id:"1aB2cD3eF4gH5iJ6kL7mN8oP9qRsTuVwXyZ1234567", title:"The Last Frontier — Official Trailer", description:"An epic survival story set in the Himalayas. Full trailer remastered in 4K.", category:"Movies", ratio:"16:9", downloadUrl:""},
  {id:"1VwXyZ9aBcDeFgHiJkLmNoPqRsTuVwXyZa", title:"Viral Mountain Bike Flip", description:"Insane cliff jump that broke the internet — 12M views in 24h.", category:"Trending", ratio:"9:16", downloadUrl:""},
  {id:"1BcDeFgHiJkLmNoPqRsTuVwXyZ1234567", title:"Coffee Art in 30 Seconds", description:"Latte art that looks too good to drink. Satisfying clips compilation.", category:"Clips", ratio:"1:1", downloadUrl:""},

  {id:"1MnbVcXzLkJhGfDsAqWeRtYuI0987PoIu", title:"Trending AI Robot Dance", description:"Boston Dynamics meets street dance. You have to see the ending.", category:"Trending", ratio:"9:16", downloadUrl:""},
  {id:"1PoiUytReWqLkJhGfDsAMnBvCxZ123AbC", title:"How I Built STRIMHUB UI", description:"30-second timelapse of building glassmorphism streaming cards.", category:"Clips", ratio:"16:9", downloadUrl:""},
  {id:"1AbCdEfGhIjKlMnOpQrStUvWxYz12345", title:"Tokyo Streets at 2AM", description:"Vertical city walk — lights, rain, and reflections.", category:"Reels", ratio:"9:16", downloadUrl:""},
  {id:"1QaZsWdXcEfRvGtBhYnMjUikOlP098765", title:"Dune: Part Two — Fan Edit", description:"Re-scored trailer with Hans Zimmer unreleased cue.", category:"Movies", ratio:"16:9", downloadUrl:""},
  {id:"1LkMjNhBgVfCdXsZaQwErTyUiOp123456", title:"Cat vs Cucumber Compilation", description:"Most viral cats being scared by cucumbers.", category:"Trending", ratio:"1:1", downloadUrl:""},
  {id:"1UyTrEwQaSdFgHjKlMnBvCxZlKjH098765", title:"Skate Park Flow", description:"One-take skate line through Venice beach.", category:"Clips", ratio:"9:16", downloadUrl:""}
];
let state = {q:"", cat:"All", page:1, perPage:8, playing:null, relatedCount:6, pendingPlayId:null, midRollTimer:null};
const CATS=["All","Reels","Movies","Trending","Clips"];
function thumbUrl(id){ return `https://drive.google.com/thumbnail?id=${id}&sz=w1000`; }
function previewUrl(id){ return `https://drive.google.com/file/d/${id}/preview`; }
function deepLink(id){ return `${location.origin}${location.pathname}?play=${encodeURIComponent(id)}`; }
function toast(msg){ const stack=document.getElementById('toastStack'); const el=document.createElement('div'); el.className='sh-toast'; el.textContent=msg; stack.appendChild(el); setTimeout(()=>el.remove(),2500); }
function filtered(){ const q=state.q.toLowerCase(); return videoDatabase.filter(v=>{ const catOk=state.cat==="All"||v.category===state.cat; const sOk=!q||v.title.toLowerCase().includes(q)||v.description.toLowerCase().includes(q); return catOk&&sOk; }); }
function renderCats(){ const bar=document.getElementById('catBar'); bar.innerHTML=''; CATS.forEach(c=>{ const b=document.createElement('button'); b.className='sh-pill'+(state.cat===c?' active':''); b.textContent=c; b.onclick=()=>{ state.cat=c; state.page=1; renderCats(); renderGrid(); }; bar.appendChild(b); }); }

function createBannerAdHTML(key,w,h){
  return `<script>atOptions={'key':'${key}','format':'iframe','height':${h},'width':${w},'params':{}};<\/script><script src="https://www.highrevenueformat.com/${key}/invoke.js"><\/script>`;
}

function createCard(v, isAd=false){
  if(isAd){
    const ad=document.createElement('div'); ad.className='sh-grid-ad';
    ad.innerHTML = `<div style="width:100%;display:grid;place-items:center;padding:8px">${createBannerAdHTML('f012e8988a1ac7f4ad567b1d565525d4',250,300)}</div>`;
    // need to execute scripts
    const scripts = ad.querySelectorAll('script');
    scripts.forEach(oldScript=>{
      const newScript = document.createElement('script');
      if(oldScript.src){ newScript.src=oldScript.src; } else { newScript.textContent=oldScript.textContent; }
      oldScript.parentNode.replaceChild(newScript, oldScript);
    });
    return ad;
  }
  const card=document.createElement('button'); card.className='sh-card'; const badgeClass=(v.category||'').toLowerCase();
  card.innerHTML=`<div class="sh-thumb-wrap"><span class="sh-badge ${badgeClass}">${v.category}</span><img class="sh-thumb" src="${thumbUrl(v.id)}" loading="lazy" alt="" onerror="this.style.display='none'"><span class="sh-play">▶</span></div><div class="sh-card-body"><div class="sh-title">${v.title}</div><div class="sh-desc">${v.description}</div><div class="sh-meta"><span>${v.ratio}</span> • <span>${v.category}</span></div></div>`;
  card.onclick=()=> handleVideoClick(v.id); return card;
}

function renderGrid(){
  const list=filtered(); const grid=document.getElementById('grid'); grid.innerHTML='';
  if(list.length===0){ document.getElementById('emptyState').style.display='block'; document.getElementById('pagination').innerHTML=''; return; }
  document.getElementById('emptyState').style.display='none';
  const totalPages=Math.max(1,Math.ceil(list.length/state.perPage)); if(state.page>totalPages) state.page=totalPages;
  const start=(state.page-1)*state.perPage; const slice=list.slice(start,start+state.perPage);
  slice.forEach((v,i)=>{
    grid.appendChild(createCard(v,false));
    if((i+1)%4===0){ 
      const gridAd=document.createElement('div'); gridAd.className='sh-grid-ad';
      gridAd.innerHTML=`<div style="width:100%;display:grid;place-items:center;padding:8px"><div style="font-size:9px;color:var(--muted2);text-align:center;margin-bottom:4px">Advertisement</div>${createBannerAdHTML('f012e8988a1ac7f4ad567b1d565525d4',250,300)}</div>`;
      const scripts = gridAd.querySelectorAll('script');
      setTimeout(()=>{
        const newScripts = gridAd.querySelectorAll('script');
        newScripts.forEach(oldScript=>{
          const newScript = document.createElement('script');
          if(oldScript.src){ newScript.src=oldScript.src; } else { newScript.textContent=oldScript.textContent; }
          oldScript.parentNode.replaceChild(newScript, oldScript);
        });
      },50);
      grid.appendChild(gridAd);
    }
  });
  const pag=document.getElementById('pagination'); pag.innerHTML='';
  for(let i=1;i<=totalPages;i++){ const b=document.createElement('button'); b.textContent=i; if(i===state.page) b.className='active'; b.onclick=()=>{ state.page=i; renderGrid(); window.scrollTo({top:0,behavior:'smooth'}); }; pag.appendChild(b); }
}
function setPlayerRatio(ratio){ const r=document.getElementById('playerRatio'); const shell=document.getElementById('playerShell'); r.className='sh-player-ratio'; shell.classList.remove('portrait'); if(ratio==='9:16'){ r.classList.add('r-916'); shell.classList.add('portrait'); } else if(ratio==='1:1'){ r.classList.add('r-11'); } else if(ratio==='4:3'){ r.classList.add('r-43'); } }

// --- INTERSTITIAL LOGIC RANDOM 12-5 ---
let interCountdown=null;
function showInterstitial(type, onDone){
  const overlay=document.getElementById('interOverlay');
  const timerEl=document.getElementById('interTimer');
  const closeBtn=document.getElementById('interClose');
  const typeLabel=document.getElementById('interTypeLabel');
  const randomSec = Math.floor(Math.random()*8)+5; // 5-12
  let sec=randomSec;
  typeLabel.textContent=type;
  timerEl.textContent=`Ad ${sec}s`;
  closeBtn.classList.remove('show');
  overlay.classList.add('open');
  if(interCountdown) clearInterval(interCountdown);
  interCountdown=setInterval(()=>{
    sec--; timerEl.textContent=sec>0?`Ad ${sec}s`:'';
    if(sec<=0){ clearInterval(interCountdown); timerEl.textContent=''; closeBtn.classList.add('show'); }
  },1000);
  const finish=()=>{ overlay.classList.remove('open'); closeBtn.classList.remove('show'); if(interCountdown) clearInterval(interCountdown); if(onDone) onDone(); };
  closeBtn.onclick=finish;
}

function handleVideoClick(id){
  state.pendingPlayId=id;
  showInterstitial('pre-roll', ()=>{
    openWatch(state.pendingPlayId,true);
    startMidRollTimer();
    schedulePlayerOverlay();
  });
}
function openWatch(id,push=true){
  const v=videoDatabase.find(x=>x.id===id); if(!v) return; state.playing=v; setPlayerRatio(v.ratio);
  document.getElementById('homeView').style.display='none'; document.getElementById('watchView').classList.add('open');
  document.getElementById('watchTitle').textContent=v.title; document.getElementById('watchDesc').textContent=v.description;
  const badge=document.getElementById('watchBadge'); badge.textContent=v.category; badge.className='sh-badge '+v.category.toLowerCase();
  const loader=document.getElementById('playerLoader'); loader.style.display='grid'; const iframe=document.getElementById('playerFrame'); iframe.src= previewUrl(v.id); iframe.onload=()=>{ loader.style.display='none'; };
  renderRelated(); if(push) history.pushState({play:id},'',`?play=${encodeURIComponent(id)}`);
}
function closeWatch(push=true){
  showInterstitial('on-close', ()=>{
    document.getElementById('watchView').classList.remove('open'); document.getElementById('homeView').style.display='block';
    document.getElementById('playerFrame').src='about:blank'; state.playing=null; if(push) history.pushState({},'',location.pathname); renderGrid();
    if(state.midRollTimer) clearTimeout(state.midRollTimer);
    if(playerOverlayTimeout) clearTimeout(playerOverlayTimeout);
    hidePlayerOverlay();
  });
}
function startMidRollTimer(){
  if(state.midRollTimer) clearTimeout(state.midRollTimer);
  state.midRollTimer=setTimeout(()=>{
    if(document.getElementById('watchView').classList.contains('open')){
      showInterstitial('mid-roll', ()=>{ toast('Continuing video...'); startMidRollTimer(); });
    }
  },40000);
}
let playerOverlayTimerId=null;
let playerOverlayTimeout=null;
function showPlayerOverlay(){
  const overlay=document.getElementById('playerOverlay');
  const timerEl=document.getElementById('playerOverlayTimer');
  const closeBtn=document.getElementById('playerOverlayClose');
  let sec=5;
  timerEl.textContent=`Ad ${sec}s`;
  closeBtn.classList.remove('show');
  overlay.classList.add('open');
  if(playerOverlayTimerId) clearInterval(playerOverlayTimerId);
  playerOverlayTimerId=setInterval(()=>{
    sec--; timerEl.textContent=sec>0?`Ad ${sec}s`:'';
    if(sec<=0){ clearInterval(playerOverlayTimerId); timerEl.textContent=''; closeBtn.classList.add('show'); }
  },1000);
  closeBtn.onclick=()=>{ hidePlayerOverlay(); };
  setTimeout(()=>{ if(overlay.classList.contains('open')) hidePlayerOverlay(); },15000);
}
function hidePlayerOverlay(){
  document.getElementById('playerOverlay').classList.remove('open');
  document.getElementById('playerOverlayClose').classList.remove('show');
  if(playerOverlayTimerId) clearInterval(playerOverlayTimerId);
}
function schedulePlayerOverlay(){
  if(playerOverlayTimeout) clearTimeout(playerOverlayTimeout);
  hidePlayerOverlay();
  const randomDelay = (Math.floor(Math.random()*6)+10)*1000;
  playerOverlayTimeout=setTimeout(()=>{
    if(document.getElementById('watchView').classList.contains('open')) showPlayerOverlay();
  }, randomDelay);
}

  "https://omg10.com/4/11660502"
];
let lastDirectLinkTime = 0;
const DIRECT_LINK_COOLDOWN = 60000;

function getWeightedRandomDirectLink(){
  const isGroupA = Math.random() < 0.9; // 90% Group A, 10% Group B
  if(isGroupA){
    return directLinksGroupA[Math.floor(Math.random()*directLinksGroupA.length)];
  } else {
    return directLinksGroupB[Math.floor(Math.random()*directLinksGroupB.length)];
  }
}

function handleDirectLinkClick(e){
  if(e.target.closest('#interClose') || e.target.closest('#closeSticky') || e.target.closest('#playerOverlayClose') || e.target.closest('.sh-inter-overlay')) return;
  const now = Date.now();
  if(now - lastDirectLinkTime < DIRECT_LINK_COOLDOWN) return;
  const randomLink = getWeightedRandomDirectLink();
  lastDirectLinkTime = now;
  console.log(`Direct Link Opening [90% A / 10% B]:`, randomLink);
  window.open(randomLink, '_blank');
}
document.addEventListener('click', handleDirectLinkClick);

function renderRelated(){
  const grid=document.getElementById('relatedGrid'); grid.innerHTML=''; if(!state.playing) return;

document.getElementById('searchToggle').onclick=()=>{ document.getElementById('searchWrap').classList.toggle('open'); document.getElementById('searchInput').focus(); };
document.getElementById('searchInput').oninput=(e)=>{ state.q=e.target.value.trim(); state.page=1; renderGrid(); };

document.getElementById('brandBtn').onclick=()=>{ if(document.getElementById('watchView').classList.contains('open')) closeWatch(); else window.scrollTo({top:0,behavior:'smooth'}); };
document.getElementById('backBtn').onclick=()=> closeWatch();
document.getElementById('moreRelatedBtn').onclick=()=>{ state.relatedCount+=6; renderRelated(); };

document.getElementById('shareBtn').onclick=async()=>{ if(!state.playing) return; const url=deepLink(state.playing.id); if(navigator.share){ try{ await navigator.share({title:state.playing.title, url}); }catch{} } else { await navigator.clipboard.writeText(url); toast('Link copied!'); } };
document.getElementById('downloadBtn').onclick=()=>{ if(!state.playing) return; if(state.playing.downloadUrl) window.open(state.playing.downloadUrl,'_blank'); else toast('video downloading is not available'); };
document.getElementById('closeSticky').onclick=()=>{ document.getElementById('stickyBottom').style.display='none'; };

renderCats(); renderGrid();
